        function renderPresetGrids() {
            ['grid-size-35', 'grid-size-36-37', 'grid-size-38-39', 'grid-size-40'].forEach(groupId => {

                    card.innerHTML = `
                        <div class="flex-1 pr-3 pointer-events-none flex items-center justify-between">
                            <div class="flex items-center space-x-2"><span class="text-[13px] font-bold text-slate-800 leading-snug">${item.label}</span>${isSelected ? `<span class="${item.gender==='nam'?'bg-blue-500':'bg-pink-500'} text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">x${qty}</span>` : ''}</div>
                            <div class="text-[13px] font-black ${item.gender==='nam'?'text-blue-600':'text-pink-600'} mr-2">${item.priceShort}</div>
                        </div>
                        <div class="flex items-center space-x-0.5 shrink-0 bg-slate-100 p-0.5 rounded-lg border border-slate-200" onclick="event.stopPropagation()">
                            <button type="button" onclick="changeTierQty('${item.id}', -1)" class="w-7 h-7 rounded-md ${isSelected ? 'bg-white text-slate-700 shadow-sm' : 'text-slate-400 hover:bg-slate-200'} font-black">-</button>
                            <input type="number" min="0" value="${qty}" onfocus="this.select()" oninput="setTierQty('${item.id}', this.value)" class="w-7 text-center bg-transparent font-black text-sm ${isSelected ? 'text-slate-900' : 'text-slate-400'} focus:outline-none p-0">
                            <button type="button" onclick="changeTierQty('${item.id}', 1)" class="w-7 h-7 rounded-md ${isSelected ? (item.gender === 'nam' ? 'bg-blue-500' : 'bg-pink-500') : 'bg-white'} ${isSelected?'text-white shadow-sm':'text-slate-600'} font-black">+</button>

        function changeTierQty(id, delta) { selectedQuantities[id] = Math.max(0, (selectedQuantities[id] || 0) + delta); renderPresetGrids(); calculateTotal(); }
        function setTierQty(id, val) { selectedQuantities[id] = Math.max(0, parseInt(val) || 0); calculateTotal(); }
        function resetAllSelections() { SHOE_TIERS.forEach(t => selectedQuantities[t.id] = 0); document.getElementById('custom-price').value = ''; document.getElementById('custom-qty').value = 0; document.getElementById('custom-price-preview').classList.add('hidden'); renderPresetGrids(); calculateTotal(); }

        function setCustomGender(g) { customGender = g; document.getElementById('err-gender-nu').className = g === 'nu' ? "px-2.5 py-1 rounded-md bg-pink-500 text-white shadow-sm transition" : "px-2.5 py-1 rounded-md text-slate-500 transition"; document.getElementById('err-gender-nam').className = g === 'nam' ? "px-2.5 py-1 rounded-md bg-blue-600 text-white shadow-sm transition" : "px-2.5 py-1 rounded-md text-slate-500 transition"; calculateTotal(); }
        function parseCustomPriceValue() { let raw = parseInt(document.getElementById('custom-price').value) || 0; if (raw > 0 && raw < 10000) raw *= 1000; return raw; }
        function handleCustomPriceFocus() { if ((parseInt(document.getElementById('custom-qty').value) || 0) === 0) document.getElementById('custom-qty').value = 1; calculateTotal(); }
        function handleCustomPriceInput() { const p = parseCustomPriceValue(); if (p > 0 && (parseInt(document.getElementById('custom-qty').value) || 0) === 0) document.getElementById('custom-qty').value = 1; const prev = document.getElementById('custom-price-preview'); if (p > 0) { prev.classList.remove('hidden'); prev.innerText = `Đang tính giá: ${formatMoney(p)}/đôi`; } else { prev.classList.add('hidden'); } calculateTotal(); }
        function handleCustomPriceBlur() { if ((parseInt(document.getElementById('custom-price').value) || 0) === 0) { document.getElementById('custom-qty').value = 0; document.getElementById('custom-price-preview').classList.add('hidden'); } calculateTotal(); }
        function adjustCustomQty(delta) { document.getElementById('custom-qty').value = Math.max(0, (parseInt(document.getElementById('custom-qty').value) || 0) + delta); calculateTotal(); }

        function calculateTotal() {
            let money = 0, pairs = 0, sum = [];
            SHOE_TIERS.forEach(t => { const q = selectedQuantities[t.id] || 0; if (q > 0) { pairs += q; money += q * t.price; sum.push(`${q}x ${t.label}`); } });
            const cp = parseCustomPriceValue(); const cq = Math.max(0, parseInt(document.getElementById('custom-qty').value) || 0);
            if (cp > 0 && cq > 0) { pairs += cq; money += cp * cq; sum.push(`${cq}x Giá khác`); }
            document.getElementById('total-price-value').innerText = formatMoney(money);
            document.getElementById('summary-items-text').innerText = pairs > 0 ? `${pairs} đôi: ` + sum.join(', ') : 'Chưa chọn đôi nào';
            return { money, pairs, sum };
        }

        // Tăng mức độ nén: Giảm chiều ngang còn 800px, chất lượng còn 50%
        async function compressImage(file, maxWidth = 800, quality = 0.5) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })); }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadToImageKit(file) {
            const compressedFile = await compressImage(file);
            const fd = new FormData(); fd.append('file', compressedFile); fd.append('fileName', compressedFile.name || `donggia_${Date.now()}.jpg`); fd.append('folder', APP_CONFIG.imageKitFolder);
            try {
                const res = await fetch('https://upload.imagekit.io/api/v1/files/upload', { method: 'POST', headers: { 'Authorization': 'Basic ' + btoa(APP_CONFIG.imageKitPrivateKey + ':') }, body: fd });
                if (!res.ok) throw new Error("Upload ảnh thất bại"); return (await res.json()).url;
            } catch (err) { console.error(err); return null; }
        }

        async function sendTelegram(text) {
            if (!APP_CONFIG.telegramToken) return;
            try { await fetch(`https://api.telegram.org/bot${APP_CONFIG.telegramToken}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: APP_CONFIG.telegramChat, text: text, parse_mode: 'HTML' }) }); } catch (e) { }
        }

        async function submitBanGiay(e) {
            e.preventDefault();
            const calc = calculateTotal();
            if (calc.pairs === 0) { showToast("Vui lòng nhấp chọn ít nhất 1 đôi giày!", "warning"); return; }
            
            // VALIDATE ẢNH BẮT BUỘC
            const fileGiay = document.getElementById('mua-anhgiay').files[0];
            if (!fileGiay) { showToast("Vui lòng CHỤP ẢNH GIÀY để lưu đơn!", "danger"); return; }
            
            const fileBill = document.getElementById('mua-anhbill') ? document.getElementById('mua-anhbill').files[0] : null;
            if (currentPaymentMethod === 'Chuyển khoản' && !fileBill) { showToast("Khách chuyển khoản vui lòng CHỤP ẢNH BILL!", "danger"); return; }

            const btn = document.getElementById('btn-submit-mua'); const ogHtml = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i><span>Đang xử lý...</span>`; lucide.createIcons();
            document.getElementById('global-loading').style.display = 'flex';

            let items = [], cNu = 0, cNam = 0;
            SHOE_TIERS.forEach(t => { const q = selectedQuantities[t.id] || 0; if (q > 0) { items.push({ tierId: t.id, label: t.label, price: t.price, qty: q, gender: t.gender }); if (t.gender === 'nam') cNam += q; else cNu += q; } });
            const cp = parseCustomPriceValue(); const cq = Math.max(0, parseInt(document.getElementById('custom-qty').value) || 0);
            if (cp > 0 && cq > 0) { items.push({ tierId: 'custom_error', label: `Giá khác (${customGender === 'nam' ? 'Nam' : 'Nữ'})`, price: cp, qty: cq, gender: customGender }); if (customGender === 'nam') cNam += cq; else cNu += cq; }

            try {
                let urlGiay = await uploadToImageKit(fileGiay);
                let urlBill = currentPaymentMethod === 'Chuyển khoản' ? await uploadToImageKit(fileBill) : "";

                const payload = {
                    khachHang: "Khách vãng lai", ghiChu: document.getElementById('ban-ghichu').value.trim(),
                    items: items, tomTat: calc.sum.join(' + '), tongDoi: calc.pairs, soDoiNu: cNu, soDoiNam: cNam,
                    tongTien: calc.money, hinhThuc: currentPaymentMethod, urlAnhGiay: urlGiay || "", urlAnhBill: urlBill || "", thoiGian: new Date().toISOString()
                };

                await window.fbAddDoc(window.fbCollection(window.firebaseDb, APP_CONFIG.firestoreCollection), payload);
                const teleMsg = `👟 <b>[ĐỒNG GIÁ] ĐƠN MỚI</b>\n📦 Chi tiết: ${payload.tomTat}\n👩 Nữ/Kid: ${cNu} đôi | 👨 Nam: ${cNam} đôi\n💵 Tổng: <b>${formatMoney(payload.tongTien)}</b> (${payload.hinhThuc})${payload.ghiChu ? `\n📝 CT: ${payload.ghiChu}` : ''}`;
                sendTelegram(teleMsg);

                showToast("Đã chốt đơn thành công!", "success");
                resetAllSelections(); document.getElementById('ban-ghichu').value = '';
                document.getElementById('mua-anhgiay').value = ''; document.getElementById('mua-preview-giay').classList.add('hidden'); document.getElementById('mua-ph-giay').classList.remove('hidden');
                document.getElementById('mua-anhbill').value = ''; document.getElementById('mua-preview-bill').classList.add('hidden'); document.getElementById('mua-ph-bill').classList.remove('hidden');
                selectPayment('Tiền mặt');
            } catch (err) { showToast("Lỗi: " + err.message, "danger"); } 
            finally { btn.disabled = false; btn.innerHTML = ogHtml; document.getElementById('global-loading').style.display = 'none'; lucide.createIcons(); }
        }

        function formatMoney(a) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(a || 0); }
        function previewImage(input, targetId) { const target = document.getElementById(targetId); const ph = document.getElementById(targetId.replace('preview', 'ph')); if (input.files && input.files[0]) { const r = new FileReader(); r.onload = function(e) { target.style.backgroundImage = `url(${e.target.result})`; target.classList.remove('hidden'); if (ph) ph.classList.add('hidden'); }; r.readAsDataURL(input.files[0]); } }
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toast-container'); const t = document.createElement('div');
            t.className = `${type==='danger'?'bg-red-600':(type==='warning'?'bg-amber-500':'bg-emerald-600')} text-white flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-xs font-bold transform translate-y-2 opacity-0 transition duration-300`;
            t.innerHTML = `<i data-lucide="${type==='danger'?'alert-circle':(type==='warning'?'info':'check-circle-2')}" class="w-4 h-4 shrink-0"></i><span>${msg}</span>`;
            c.appendChild(t); lucide.createIcons();
            setTimeout(() => t.classList.remove('translate-y-2', 'opacity-0'), 30);
            setTimeout(() => { t.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => t.remove(), 300); }, 2400);
        }
    </script>
</body>
